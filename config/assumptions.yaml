# Forward-model inputs (Phase 2 engine reads this file).
#
# Every uncertain input has:
#   value            P50 / the number used in single-value mode
#   dist             how Monte Carlo draws it: triangular | lognormal | beta | fixed
#   low/mode/high    triangular;  median/sigma  lognormal;  mean/sd  beta
#   calibrated_from  the v_calibration param it came from (tests check the SQL value
#                    still falls inside [low, high] whenever the warehouse is rebuilt)
#   per_engagement   true = the distribution is engagement-to-engagement spread (used in the
#                    Day-90 calculation and the engagement simulator), NOT drawn once per trial
#
# Nodes with a `dist` (and no per_engagement) are uncertain: Monte Carlo draws one value per
# trial. Nodes with only a `value` are levers or fixed facts; scenarios override them.
#   note             why the range is as wide or narrow as it is
#
# Calibrated against the made-up warehouse as of 2026-09-30. Not Anthropic data.

horizon:
  start: 2026-10-01
  months: 24

# ------------------------------------------------------------------ demand
demand:
  requests_per_month:
    value: 16
    dist: triangular
    low: 11.5
    mode: 16
    high: 22
    calibrated_from: requests_per_month_trend
    note: >
      Demand level at the as-of month from the log-linear trend fit (v_calibration.requests_per_month_trend),
      not the trailing 6-month average (13), which lags a growing series by ~3 months. Range from the fit's
      standard error (P10-P90 about 11.6-22.1): the backtest showed a level estimated from 12-18 noisy
      months can be off by 20-25%. (v2, 2026-10-24)
  monthly_growth:
    value: 0.06
    dist: triangular
    low: 0.02
    mode: 0.06
    high: 0.10
    calibrated_from: monthly_demand_growth
    note: >
      Trend fit on 18 noisy monthly points. The point estimate swings 0.06-0.09 between rebuilds,
      so the mode is set at the conservative end and the range is wide. Highest-leverage input.
  fit_rate:
    value: 0.84
    dist: beta
    mean: 0.84
    sd: 0.04
    note: >
      1 - decline_fit_rate. Capacity declines are NOT an input: in the forward model they are an
      output of the capacity gap.
  segment_mix: {Commercial: 0.70, Research: 0.17, Mission: 0.13}
  region_mix: {AMER: 0.55, EMEA: 0.30, APAC: 0.15}
  type_mix:
    value: {Greenfield: 0.52, Pattern-based: 0.31, Expansion: 0.17}
    note: Requests in the last 6 months. Only the Pattern-based to Expansion ratio is used; Greenfield comes from greenfield_share.
  greenfield_share:
    value: 0.52
    dist: triangular
    low: 0.44
    mode: 0.52
    high: 0.62
    note: Share of new requests that are Greenfield at the start of the horizon (falls as reuse rises).
  greenfield_shift_per_reuse:
    value: 0.5
    dist: triangular
    low: 0.0
    mode: 0.5
    high: 1.0
    note: >
      Each +1pt of reuse moves this many points of new demand from Greenfield to Pattern-based /
      Expansion (customers ask for what already exists). Judgment, not observable yet. Set from priors, independently of the data generator's settings (v2, 2026-10-24).
  greenfield_growth_correlation:
    value: 0.5
    note: Monte Carlo draws demand growth and greenfield share with this rank correlation (new demand skews to new use cases).
  backlog_abandon_rate:
    value: 0.75
    dist: triangular
    low: 0.5
    mode: 0.75
    high: 0.95
    note: >
      Share of unserved demand that walks away each month (becomes a capacity decline); the rest
      waits in the backlog. Judgment, raised from 0.5 after the backtest under-predicted capacity
      declines (in the history, requests are declined at the decision rather than waiting). Because the
      backtest informed it, this input is no longer an out-of-sample test. (v2, 2026-10-24)
  intake:
    note: >
      PRIORITIZATION LEVER. Share of fit requests of each type the team chooses to take on; the rest
      are declined by policy up front (counted separately from capacity declines). Greenfield is the
      lever that matters: it is ~3x the effort of pattern-based work and partners can't take it.
      Coverage is measured against the demand taken on.
    Greenfield:
      value: 1.0
    Pattern-based:
      value: 1.0
    Expansion:
      value: 1.0

# ------------------------------------------------------------------ supply
supply:
  starting_headcount:
    note: Roster at 2026-09-30 (v_headcount_monthly). Managers do not deploy; capacity uses ICs.
    by_region_role:
      AMER: {FDE: 12, Senior FDE: 8, Eng Manager: 3}
      EMEA: {FDE: 6, Senior FDE: 5, Eng Manager: 2}
      APAC: {FDE: 2, Senior FDE: 1, Eng Manager: 1}
  open_reqs:
    value: 5
    calibrated_from: open_reqs
  hires_per_month:
    value: 2.3
    note: Hiring plan lever (base = recent pace). Reqs opened each month; hires land time_to_fill later. Scenarios override this.
  hiring_region_mix:
    value: {AMER: 0.55, EMEA: 0.30, APAC: 0.15}
    note: Where new reqs are opened. Lever.
  senior_share_of_hires:
    value: 0.35
  in_ramp_at_start:
    value: 7
    note: ICs hired in the last 3 months (~2.3/mo), still ramping at the start of the horizon; spread evenly over ramp months 1-3.
  manager_span:
    value: 8
    note: ICs per manager; manager hires are added automatically to hold the span.
  time_to_fill_days:
    value: 70
    dist: triangular
    low: 50
    mode: 65
    high: 100
    calibrated_from: time_to_fill_p50
  ramp: [0.25, 0.50, 0.75, 1.00]      # month 1-4+ of tenure; v_ramp
  ramp_uncertainty:
    value: 1.0
    dist: triangular
    low: 0.8
    mode: 1.0
    high: 1.1
    note: Multiplier on months 1-3 of the ramp curve. Measured ramp is tight in the data, but it is from one hiring cohort profile.
  annual_attrition:
    value: 0.20
    dist: triangular
    low: 0.10
    mode: 0.18
    high: 0.30
    calibrated_from: annual_attrition
    note: >
      ~12 exits on a ~40-person team, so the estimate is noisy (0.16-0.25 across rebuilds).
      Monte Carlo draws the rate, then draws exits per head per month (binomial).

# ------------------------------------------------------------------ overhead (share of non-PTO hours, ramped ICs)
overhead:
  pto_share:
    value: 0.07
    dist: triangular
    low: 0.05
    mode: 0.07
    high: 0.09
    calibrated_from: pto_share
    note: Share of ALL hours.
  presales_share:
    value: 0.10
    dist: triangular
    low: 0.08
    mode: 0.10
    high: 0.13
    calibrated_from: presales_share
  internal_share:
    value: 0.08
    dist: triangular
    low: 0.06
    mode: 0.08
    high: 0.11
    calibrated_from: internal_share_ic
    note: Ramped ICs only; ramp time and managers are modeled separately.
  harvest_share:
    value: 0.07
    note: LEVER, not uncertain. 0.03 before the 2026 productization push, 0.07 since. Productize scenario = 0.12.
  reference_harvest_share:
    value: 0.07
    note: Harvest share during the calibration window (durations were measured at this level).
  harvest_from_slack:
    value: 0.0
    note: >
      Share of harvest time ABOVE the reference level that comes out of bench / fragmentation slack
      instead of delivery hours. 0 = every extra harvest hour displaces a delivery hour (engagements
      stretch). Judgment; the history has ~16% of deployable time unassigned, so some slack exists.
  target_utilization:
    value: 0.82
    dist: triangular
    low: 0.76
    mode: 0.82
    high: 0.88
    calibrated_from: planned_allocation
    note: >
      STAFFING-MATCH LEVER. Share of a ramped FDE's delivery time actually assigned to engagements;
      the rest is unassigned because of skills, region or timing mismatch. Measured: 81% over the last
      6 months, 87% over the last 3 (v_calibration.planned_allocation) — while ~30% of fit requests
      were declined for capacity, so this is a matching problem, not spare capacity. Raising it
      (cross-region staffing, skills pools, better scheduling) adds capacity without hiring.
  reference_delivery_share:
    value: 0.70
    note: >
      Delivery hours / all hours for a ramped IC during the calibration window:
      (1 - PTO 0.07) x (1 - presales 0.10 - internal 0.08 - harvest 0.07). Durations were measured
      at this level, so raising any overhead above it stretches engagements proportionally.

# ------------------------------------------------------------------ cycle time
cycle_time:
  base_duration_days:
    note: Kickoff -> production at reference staffing, no reuse, no blocker (v_duration_fit.median_base_days).
    Greenfield:
      value: 96
      dist: lognormal
      per_engagement: true
      median: 96
      sigma: 0.37
      calibrated_from: median_days_greenfield_base
    Pattern-based:
      value: 48
      dist: lognormal
      per_engagement: true
      median: 48
      sigma: 0.45
      calibrated_from: median_days_pattern_based_base
      note: Only ~10 completed engagements; sigma set between the measured value and Greenfield's.
    Expansion:
      value: 38
      dist: lognormal
      per_engagement: true
      median: 38
      sigma: 0.40
      calibrated_from: median_days_expansion_base
      note: Only ~4 completed engagements; sigma borrowed from Pattern-based.
  median_uncertainty:
    value: 1.0
    dist: triangular
    low: 0.85
    mode: 1.0
    high: 1.2
    note: >
      Multiplier on all base medians per trial (parameter uncertainty), on top of the per-engagement
      lognormal spread (process noise). Skewed up because the fit excludes still-running engagements.
  fdes_per_engagement: {Greenfield: 2.0, Pattern-based: 1.3, Expansion: 1.0}   # v_calibration fdes_per_*
  ref_fdes: {Greenfield: 2.0, Pattern-based: 1.5, Expansion: 1.0}
  staffing_alpha:
    value: 0.6
    dist: triangular
    low: 0.4
    mode: 0.6
    high: 0.8
    note: >
      Duration scales with (ref / FDEs)^alpha: at 0.6, doubling a team cuts duration by about a third
      (coordination costs keep it well short of half). Not identifiable from ~100 engagements; judgment. Set from priors, independently of the data generator's settings (v2, 2026-10-24).
  blocker_prob:
    value: 0.26
    dist: beta
    mean: 0.26
    sd: 0.05
    calibrated_from: blocker_rate
  blocker_delay_weeks:
    value: 3.0
    dist: lognormal
    per_engagement: true
    median: 3.0
    sigma: 0.5
  cancel_prob:
    value: 0.07
    dist: beta
    mean: 0.07
    sd: 0.03
    calibrated_from: cancel_rate
  mobilization_days:
    value: 18
    calibrated_from: queue_wait_days_median
    note: Signature -> kickoff when FDEs are free; queue wait above this is a capacity signal.
  handoff_weeks: 2

# ------------------------------------------------------------------ partners
partners:
  weeks_per_month:
    value: 20
    note: LEVER. Contracted partner capacity in FDE-equivalent weeks (recent usage ~18/mo).
  efficiency:
    value: 0.70
    dist: triangular
    low: 0.50
    mode: 0.70
    high: 0.90
    note: >
      Partner output per week relative to an FDE on the same scope. Fewer than 10 completed partner-led
      engagements, too few to fit, so a wide judgment range. Set from priors, independently of the data generator's settings (v2, 2026-10-24).
  eligible_types: [Pattern-based, Expansion]

# ------------------------------------------------------------------ flywheel
assets:
  starting_library:
    value: 38
    calibrated_from: active_assets
  yield_at_5pct_harvest:
    value: 0.8
    dist: triangular
    low: 0.5
    mode: 0.8
    high: 1.1
    calibrated_from: harvest_yield
    calibration_scale: 0.714   # observed at 7% harvest share; x 5/7 to express at 5%
    note: v_calibration shows ~1.1 assets per closed engagement at 7% harvest, i.e. ~0.8 at 5%.
  monthly_decay:
    value: 0.04
    dist: triangular
    low: 0.02
    mode: 0.04
    high: 0.06
    calibrated_from: asset_monthly_decay
  reuse_max:
    value: 0.30
    dist: triangular
    low: 0.15
    mode: 0.30
    high: 0.50
    note: >
      Ceiling on the share of pattern-based effort assets can ever cover. Not observable yet (library is
      small), so the range is deliberately wide. The Productize decision hinges on it. Set from priors, independently of the data generator's settings (v2, 2026-10-24).
  reuse_half_k:
    value: 58
    dist: triangular
    low: 40
    mode: 58
    high: 85
    note: >
      Library size at which reuse reaches ~63% of its ceiling. Calibrated through the model: with the
      v2 judgment priors (ceiling 0.30, greenfield factor 0.5), k = 58 reproduces the measured 9% reuse
      ratio at the start of the horizon. tests/test_model.py checks this.
  greenfield_reuse_factor:
    value: 0.5
    dist: triangular
    low: 0.25
    mode: 0.5
    high: 0.75
    note: Greenfield builds reuse this fraction as much as pattern-based ones. Judgment. Set from priors, independently of the data generator's settings (v2, 2026-10-24).
  current_reuse_ratio:
    value: 0.09
    calibrated_from: reuse_ratio
    note: Starting point check only; the model derives reuse from the library.

# ------------------------------------------------------------------ economics (illustrative)
economics:
  fde_loaded_cost_per_week: 6700        # ~$350K/yr fully loaded
  partner_cost_per_week: 8000           # ~$200/hr
  consumption_lift_m6:
    value: 5.0
    calibrated_from: consumption_lift_m6
    note: Median account spend 6 months after go-live vs the 3 months before kickoff.

# ------------------------------------------------------------------ targets and Monte Carlo
targets:
  coverage: 0.90
  day90_rate: 0.75
  reuse_ratio: 0.25

monte_carlo:
  trials: 2000
  seed: 7
  commit_level: 0.80
